[project]
name = "long-chess"
version = "1.0.0"
description = "Companion repository for 'The maximum length of a chess game under the FIDE Laws is 17,697 plies'"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Junyeop Yim", email = "junyeobe0315@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chess>=1.11",
]

[project.urls]
Repository = "https://github.com/junyeobe0315/long_chess"

[project.optional-dependencies]
solver = [
    "ortools>=9.15.6755",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# paper/ is the manuscript tree. The only Python in it regenerates slide
# figures; nothing there is imported by the package, exercised by the tests, or
# on any path a claim in CLAIMS.md depends on. Those scripts hold wide dict and
# comprehension literals, so the 88-column limit is not enforced on them and
# `make lint` stays a statement about the code the claims actually rest on.
# Every other rule — unused names, mutable defaults, import order — still
# applies there, and scripts/, src/, tests/ and checker/ keep the full set.
[tool.ruff.lint.per-file-ignores]
"paper/**/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
